name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Avatar palette: cyan, blue, violet, magenta.
          outputs: |
            dist/github-snake.svg?color_snake=#F859FF&color_dots=#EBEDF0,#BFEFFF,#2CD6FF,#3468FF,#764ADA
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F859FF&color_dots=#161B22,#123F57,#2CD6FF,#3468FF,#764ADA

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
